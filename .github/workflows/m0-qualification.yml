name: RoDAQ Qualification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ubuntu-22-amd64:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        sanitizer: [normal, asan, ubsan]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: |
          args=""
          if [ "${{ matrix.sanitizer }}" = asan ]; then args="-DRODAQ_ENABLE_ASAN=ON"; fi
          if [ "${{ matrix.sanitizer }}" = ubsan ]; then args="-DRODAQ_ENABLE_UBSAN=ON"; fi
          cmake -S . -B build -DRODAQ_BUILD_TESTS=ON -DRODAQ_WARNINGS_AS_ERRORS=ON $args
      - name: Build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  ubuntu-24-amd64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: cmake -S . -B build -DRODAQ_BUILD_TESTS=ON -DRODAQ_BUILD_BENCHMARKS=ON -DRODAQ_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build -j2
      - run: ctest --test-dir build --output-on-failure

  runtime-only-no-dev-submodules:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Remove development and evaluated-only dependencies
        run: |
          rm -rf third_party/googletest third_party/benchmark \
                 third_party/mimalloc third_party/onetbb
      - name: Configure Runtime only
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DRODAQ_BUILD_TESTS=OFF \
            -DRODAQ_BUILD_BENCHMARKS=OFF \
            -DRODAQ_WARNINGS_AS_ERRORS=ON
      - name: Build Runtime only
        run: cmake --build build -j2

  ubuntu-22-capacity:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure Release capacity profile
        run: |
          cmake -S . -B build-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DRODAQ_BUILD_TESTS=ON \
            -DRODAQ_BUILD_BENCHMARKS=ON \
            -DRODAQ_WARNINGS_AS_ERRORS=ON
      - name: Build capacity benchmarks
        run: |
          cmake --build build-release -j2 \
            --target rodaq_fake_acquisition_plugin rodaq_fake_storage_plugin \
              rodaq_joint_pipeline_benchmark rodaq_camera_pipeline_benchmark \
              rodaq_mixed_workload_benchmark rodaq_storage_slot_benchmark \
              rodaq_release_worker_benchmark
      - name: Run capacity profiles
        env:
          RODAQ_FAKE_ACQUISITION_PLUGIN: ${{ github.workspace }}/build-release/tests/integration/librodaq_fake_acquisition_plugin.so
          RODAQ_FAKE_STORAGE_PLUGIN: ${{ github.workspace }}/build-release/tests/integration/librodaq_fake_storage_plugin.so
        run: |
          ./build-release/benchmarks/rodaq_joint_pipeline_benchmark --benchmark_format=json
          ./build-release/benchmarks/rodaq_camera_pipeline_benchmark --benchmark_format=json
          ./build-release/benchmarks/rodaq_mixed_workload_benchmark --benchmark_format=json
          ./build-release/benchmarks/rodaq_storage_slot_benchmark --benchmark_format=json
          ./build-release/benchmarks/rodaq_release_worker_benchmark --benchmark_format=json

  ubuntu-22-clang-tsan:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang-14
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_C_COMPILER=clang-14 \
            -DCMAKE_CXX_COMPILER=clang++-14 \
            -DRODAQ_BUILD_TESTS=ON \
            -DRODAQ_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -fno-pie" \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -fno-pie" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread -rdynamic -no-pie" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"
      - name: Build runtime tests
        run: |
          cmake --build build -j2 \
            --target rodaq_admission_test rodaq_payload_pool_test \
              rodaq_observability_test rodaq_m1_integration_test \
              rodaq_quarantine_test rodaq_storage_pipeline_test \
              rodaq_logging_context_test rodaq_handle_registry_test \
              rodaq_runtime_pipeline_test
      - name: Run TSan tests
        run: |
          setarch "$(uname -m)" -R ctest --test-dir build \
            -R 'rodaq.runtime.(admission|payload_pool|observability|m1_integration|quarantine|storage_pipeline|logging_context|handle_registry)|rodaq.integration.runtime_pipeline' \
            --output-on-failure

  ubuntu-22-arm64-native:
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: [self-hosted, linux, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: cmake -S . -B build -DRODAQ_BUILD_TESTS=ON -DRODAQ_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build -j2
      - run: ctest --test-dir build --output-on-failure
